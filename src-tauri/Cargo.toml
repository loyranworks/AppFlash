[package]
name = "app-flash"
version = "0.1.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dev-dependencies]
minisign-verify = "=0.3.0"

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "=2.4.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
base64 = "=0.22.1"
png = "=0.17.16"
window-vibrancy = "=0.8.1"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-updater = "=2.14.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_Shell", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
