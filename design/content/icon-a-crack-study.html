<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AppFlash · A 与雷电裂纹</title><style>*{box-sizing:border-box}body{margin:0;background:#f0f1f3;color:#39434a;font-family:'Segoe UI','Microsoft YaHei',sans-serif}main{max-width:1080px;margin:auto;padding:64px 36px}.eyebrow{font-size:11px;letter-spacing:3px;color:#87949b}h1{font-size:28px;font-weight:500;margin:18px 0 12px}p{font-size:13px;line-height:1.9;color:#849198}.hero{display:flex;align-items:center;gap:56px;margin:42px 0;padding:46px;background:#e7ecef;border-radius:24px}.hero img{width:192px;height:192px}.hero strong{font-size:24px;font-weight:500}.sizes{display:flex;gap:64px;align-items:flex-end;padding:35px 0}.sample{display:flex;flex-direction:column;align-items:center;gap:20px;min-width:100px}.sample span{font-size:12px;color:#849198}.small-check{display:flex;gap:48px;margin-top:28px;padding:30px;border:1px solid #dce2e5;border-radius:16px}.zoom{width:128px;height:128px;image-rendering:pixelated}a{color:#71899a;font-size:13px}footer{margin-top:36px;font-size:12px;color:#849198}@media(max-width:650px){main{padding:32px 20px}.hero{padding:24px;gap:24px}.hero img{width:128px;height:128px}.sizes{gap:16px;flex-wrap:wrap}.small-check{flex-wrap:wrap}}</style><main><div class="eyebrow">APPFLASH / SYMBOL STUDY</div><h1>A · 圆形底 · 自然雷电裂纹</h1><p>莫兰迪蓝与默认字母徽标同色。先看轮廓与裂纹，不加发光或电光拖尾。</p><div class="hero"><img src="/files/icon-a-crack.svg" alt="莫兰迪蓝圆底，镂空 A 与分叉裂纹"><div><strong>你的应用，一闪即达。</strong><p>右上缘劈入，一条主裂纹，一条细分叉。<br>这是评审草稿，尚未定稿。</p></div></div><div class="sizes"><div class="sample"><img src="/files/icon-a-crack.svg" width="128" height="128" alt="128 像素图标"><span>128 px</span></div><div class="sample"><img src="/files/icon-a-crack.svg" width="64" height="64" alt="64 像素图标"><span>64 px</span></div><div class="sample"><img src="/files/icon-a-crack.svg" width="32" height="32" alt="32 像素图标"><span>32 px</span></div><div class="sample"><img src="/files/icon-a-crack.svg" width="16" height="16" alt="16 像素图标"><span>16 px</span></div></div><p>小尺寸检查：重点看右上裂纹是否与 A 粘连，以及细分叉是否变成杂点。正式托盘版本需要单独简化。</p><a href="/files/settings-morandi.html">查看同色设置界面 →</a><footer>当前仅为视觉原型；实际系统托盘与 macOS 菜单栏尚未验证。</footer></main></html>
