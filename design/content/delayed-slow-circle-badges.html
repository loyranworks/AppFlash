<!DOCTYPE html><html lang="zh-CN"><meta charset="utf-8"><title>AppFlash · 动态圆形提示</title><body><p>正在加载圆形预览…</p><script>
fetch('/files/cutout-badges-left-right.html').then(response=>{if(!response.ok)throw new Error('Preview unavailable');return response.text()}).then(html=>{
const style=`body{background:#f3f3f2;color:#303239}.eyebrow,.sample-caption{color:#8c8e94}.intro,.foot,.note{color:#7b7e85}.desktop{background:radial-gradient(ellipse at 10% 10%,#e9eaec,transparent 70%),linear-gradient(145deg,#d7dbe0,#b9c0cb)}.window{background:#f8f9fbba;border-color:#ffffff80;color:#a2a7b0}.paper h3{color:#858b95}.paper i{background:#ccd1d8}.key,.active .key{color:#353941}.glyph.badge{filter:none}.icon,.pair .icon{border-radius:50%;border-color:#41465042;background:#ffffff28;box-shadow:none}.active .icon{border-color:#373d5275;background:#ffffff55}.spine{background:linear-gradient(transparent,#4e535f50 8%,#4e535f50 92%,transparent)}.tick{background:#545b6880}.active .tick,.active:after{background:#353941}.prefix{color:#747985}.glyph-sample .sample{color:#353941}.glyph-sample small,.pair small,.caption span{color:#8b8e96}.note{border-color:#dedfe2}`;
html=html.replaceAll('rx="10" fill="currentColor"','rx="17" fill="currentColor"').replace('APPFLASH / CUTOUT BADGES · 08','APPFLASH / CIRCLE BADGES · 09').replace('字母是镂空徽标，应用有同形外框。','圆框，墨黑，不再带绿。').replace('圆角方形作为实体','圆形作为实体').replace('外面加同样圆角比例的轻框','外面加同尺寸的圆框').replace('字母徽标更实，应用框更轻。','字母徽标采用墨黑，应用圆框采用轻灰，不使用彩色底板。').replace('字母徽标与应用外框保持相同圆角比例。','字母徽标与应用外框统一为圆形，自绘部分采用中性墨黑与灰色。').replace('同形，不同视觉重量','圆形配对 / 墨黑字母 · 轻灰应用框').replace('</style>',style+'</style>');
const parsed=new DOMParser().parseFromString(html,'text/html');document.documentElement.replaceWith(parsed.documentElement);
const animationStyle=document.createElement('style');animationStyle.textContent=`
.preview-controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:20px 0 10px;font:12px 'Segoe UI';color:#7b7e85}.hold-prefix{border:1px solid #3c414b;border-radius:22px;padding:11px 19px;background:#353941;color:#f5f6f7;font:12px 'Segoe UI';cursor:pointer;touch-action:none;user-select:none}.hold-prefix[aria-pressed=true]{background:#596170}.preview-controls small{font-size:11px}.rail{opacity:0;visibility:hidden;pointer-events:none;transition:opacity 180ms ease-out}.rail.armed{opacity:1;visibility:visible;pointer-events:auto}.rail .spine{overflow:hidden;transform:scaleY(.3);opacity:.22;transition:transform 260ms cubic-bezier(.2,.7,.2,1),opacity 180ms}.armed .spine{transform:scaleY(1);opacity:1}.armed .spine:after{content:'';position:absolute;top:-40%;left:0;width:100%;height:35%;background:linear-gradient(transparent,#fff,#646e86,transparent);animation:line-travel 4.8s ease-in-out infinite}.rail .item{opacity:.32;transition:opacity 180ms}.armed .item{opacity:1;cursor:pointer}.rail .prefix{opacity:.3;transition:opacity 180ms}.armed .prefix{opacity:1}.tick{transition:width 170ms,background 170ms;transform-origin:right center}.left .tick{transform-origin:left center}.item.hit .tick{width:13px;background:#353941;animation:connector 380ms ease-out}.item.hit .badge{animation:badge-response 420ms cubic-bezier(.2,.8,.2,1)}.item.hit .icon{animation:icon-response 420ms ease-out}.item.hit:after{animation:node-response 420ms ease-out}.status-label{color:#5d6675;min-width:120px}
@keyframes line-travel{to{top:110%}}@keyframes connector{0%{transform:scaleX(.1);opacity:.3}55%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1)}}@keyframes badge-response{0%{transform:scale(1);opacity:.75}40%{transform:scale(1.09);opacity:1}100%{transform:scale(1)}}@keyframes icon-response{0%{border-color:#41465042}45%{border-color:#4d566b;background:#ffffff85}100%{border-color:#373d5275}}@keyframes node-response{0%{box-shadow:0 0 0 0 #35394140}70%{box-shadow:0 0 0 5px #35394100}100%{box-shadow:none}}
@media(prefers-reduced-motion:reduce){.armed .spine:after{animation:none}.rail .spine,.rail .item,.rail .prefix,.tick{transition:none}.item.hit .tick,.item.hit .badge,.item.hit .icon,.item.hit:after{animation:none}}
`;document.head.append(animationStyle);
const controls=document.createElement('div');controls.className='preview-controls';controls.innerHTML='<button type="button" class="hold-prefix" aria-pressed="false">按住模拟 prefix</button><span class="status-label" role="status">松开状态</span><small>按住满 1.5 秒才显示；字母可立即触发，不用等。也可按住 Ctrl + Alt 体验。仅当前页面有效。</small>';document.querySelector('.intro').after(controls);
const hold=controls.querySelector('button'),status=controls.querySelector('.status-label');const rails=[...document.querySelectorAll('.rail')];let pointerHeld=false,keyboardHeld=false,enterHeld=false,hintTimer=null,prefixWasHeld=false,hintVisible=false;
function refresh(){const held=pointerHeld||keyboardHeld||enterHeld;hold.setAttribute('aria-pressed',String(held));if(held&&!prefixWasHeld){status.textContent='等待 1.5 秒显示提示…';hintTimer=setTimeout(()=>{hintTimer=null;if(!(pointerHeld||keyboardHeld||enterHeld))return;hintVisible=true;rails.forEach(rail=>rail.classList.add('armed'));status.textContent='提示已显示'},1500)}if(!held){if(hintTimer!==null){clearTimeout(hintTimer);hintTimer=null}hintVisible=false;rails.forEach(rail=>rail.classList.remove('armed'));document.querySelectorAll('.rail .item').forEach(item=>item.classList.remove('active','hit'));status.textContent='松开状态 · 贴边隐藏'}prefixWasHeld=held;return held}
function respond(letter){if(!(pointerHeld||keyboardHeld||enterHeld))return;let matched=false;rails.forEach(rail=>{rail.querySelectorAll('.item').forEach(item=>{item.classList.remove('active','hit');if(item.querySelector('.key').getAttribute('aria-label')===letter){matched=true;item.classList.add('active');void item.offsetWidth;item.classList.add('hit')}})});status.textContent=matched?'触发 '+letter:'此字母未绑定'}
hold.addEventListener('pointerdown',event=>{if(event.button!==0)return;pointerHeld=true;refresh()});window.addEventListener('pointerup',()=>{pointerHeld=false;refresh()});window.addEventListener('pointercancel',()=>{pointerHeld=false;refresh()});hold.addEventListener('keydown',event=>{if(event.key===' '||event.key==='Enter'){event.preventDefault();enterHeld=true;refresh()}});hold.addEventListener('keyup',event=>{if(event.key===' '||event.key==='Enter'){event.preventDefault();enterHeld=false;refresh()}});hold.addEventListener('blur',()=>{enterHeld=false;refresh()});
window.addEventListener('keydown',event=>{keyboardHeld=event.ctrlKey&&event.altKey;refresh();if(event.repeat)return;const letter=event.key.toUpperCase();if(/^[A-Z]$/.test(letter))respond(letter)});window.addEventListener('keyup',event=>{keyboardHeld=event.ctrlKey&&event.altKey;refresh()});window.addEventListener('blur',()=>{pointerHeld=false;keyboardHeld=false;enterHeld=false;refresh()});document.addEventListener('visibilitychange',()=>{if(document.hidden){pointerHeld=false;keyboardHeld=false;enterHeld=false;refresh()}});
rails.forEach(rail=>rail.querySelectorAll('.item').forEach(item=>item.addEventListener('pointerdown',()=>respond(item.querySelector('.key').getAttribute('aria-label')))));refresh();
document.querySelector('h1').textContent='平时隐去，长按才出现。';document.querySelector('.intro').textContent='整个贴边默认隐藏。按住 prefix 满 1.5 秒才显现，流光放慢到 4.8 秒一轮；触发应用时连接线与圆框回应，松开后淡出隐藏。';document.querySelector('.note').textContent='本页仅模拟提示动画，不触发应用切换、不注册系统热键。动画不应阻塞真实切换；松开 prefix 或页面失焦即清理状态。支持减少动态效果偏好。提示等待 1.5 秒，不限制快速切换；流光 4.8 秒一轮。';
}).catch(error=>{document.body.textContent='加载失败：'+error.message});
</script></body></html>
