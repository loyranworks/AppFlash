<!DOCTYPE html><html lang="zh"><meta charset="utf-8"><title>AppFlash</title><style>body{margin:48px;background:#f5f5f1;color:#35453b;font:16px Segoe UI}h1{font-weight:500}.cards{display:flex;gap:24px}.card{flex:1;background:white;border-radius:18px;overflow:hidden;cursor:pointer}.selected{outline:3px solid #709782}.desktop{height:320px;background:linear-gradient(135deg,#dbe6dc,#acbfae);position:relative;padding:25px}.window{height:250px;background:#ffffffb0;border-radius:12px;color:#a2afa4;padding:16px}.line{height:6px;background:#c4cfc5;border-radius:3px;margin-top:23px;width:65%}.hint{position:absolute;right:8px;top:70px;padding:12px;background:#f8faf5eb;border-radius:15px;font-size:13px;box-shadow:0 8px 26px #213c2822}.hint div{margin:12px 0}kbd{padding:4px 7px;background:#e5ece3;border-radius:5px;margin-right:10px}.rail{padding:7px;border-radius:22px}.rail kbd{margin-right:5px}.pill{top:auto;bottom:25px}.pill span{display:inline-block;margin:0 5px;text-align:center}.pill kbd{display:block;margin:8px 0 0}.info{padding:20px}p,footer{color:#788277;line-height:1.7}footer{margin-top:28px;font-size:13px}</style><h1>AppFlash · 提示存在，但不打扰。</h1><p>按住 prefix 后延迟显示，松开隐藏。点击选择视觉方向；以下是模拟桌面。</p><div class="cards">
